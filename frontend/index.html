<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="/frontend/styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
        <!--<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>-->
        <title>BLADE DB</title>
    </head>
    <body>
        <div class="site-header mx-auto py-5 px-2">
            <a href="/dashboard">
                <button class="neumorphic-btn logo-container">
                    <img src="/frontend/src/logo-2-2.svg" alt="Logo" class="site-logo">
                    <div class="dot"></div>
                </button>
            </a>

            <!--<div class="header-spacer"></div>-->

            <div class="neumorphic-tab-container__controls neumorphic-outer" id="main">
                <div class="neumorphic-tab-container__control neumorphic-tab-container__control_active" data-target="explore">Explore</div>
                <div class="neumorphic-tab-container__control" data-target="leadboard">Leadboard</div>
            </div>

            <!--<div class="header-spacer"></div>-->

            <button type="button"
                    class="btn neumorphic-btn popup"
                    id="upload-button"
                    onclick="document.getElementById('zipFile').click()">
                <span class="material-symbols-outlined">ios_share</span>
                <span class="popuptext neumorphic-outer" style="pointer-events: none;" id="upload-popup">
                    Upload ZIP
                </span>
            </button>

            <input type="file"
                   id="zipFile"
                   accept=".zip"
                   hidden>

            <form id="upload-form"
                  hx-post="html/submit"
                  hx-encoding="multipart/form-data"
                  hx-swap="none"
                  style="display: none;">
                <input type="file" name="file" id="upload-file">
            </form>
        </div>
            <div class="neumorphic-outer content neumorphic-tab-container" id="main">
                <div class="neumorphic-tab-container__tab neumorphic-tab-container__tab_shown" id="explore">
                    <div class="inner_content">
                        <div class="navigation_view active neumorphic-inner" id="left-panel">
                            <div class="header">
                                Experiments
                                <button class="btn neumorphic-btn"
                                    hx-on:click="document.getElementById('category-popup').classList.toggle('show')">
                                    <span class="material-symbols-outlined">
                                        category
                                    </span>
                                </button>
                            </div>
                            <div class="popup">
                                <div class="popuptext neumorphic-card" style="border-radius: 20px;" id="category-popup">
                                        <div class="neumorphic-tab-container__controls" id="category">
                                            <div class="neumorphic-tab-container__control neumorphic-tab-container__control_active" data-target="experiments">Experiments</div>
                                            <div class="neumorphic-tab-container__control" data-target="llms">LLMs</div>
                                            <div class="neumorphic-tab-container__control" data-target="methods">Methods</div>
                                        </div>

                                    <div class="neumorphic-tab-container neumorphic-inner p-4" id="category">
                                        <div class="neumorphic-tab-container__tab neumorphic-tab-container__tab_shown" id="experiments">
                                            <!--Experiments-->
                                            <form action="/html/experiments" class="filters">
                                                <div class="filter-group">
                                                    <label for="visibility" class="neumorphic-label">Created By:</label>
                                                    <select name="visibility" class="neumorphic-input" id="visibility">
                                                        <option value="all">All</option>
                                                        <option value="personal">Personal</option>
                                                        <option value="public">Public</option>
                                                    </select>
                                                </div>
                                                <div class="filter-group">
                                                    <label for="sort" class="neumorphic-label">Sort By:</label>
                                                    <select name="sort" class="neumorphic-input" id="sort">
                                                        <option value="date">Date</option>
                                                        <option value="Name">Name</option>
                                                    </select>
                                                </div>

                                                <button type="submit" class="neumorphic-btn">
                                                    <span class="material-symbols-outlined">arrow_circle_right</span>
                                                </button>
                                            </form>
                                        </div>
                                        <div class="neumorphic-tab-container__tab" id="llms">
                                            <!--LLMs-->
                                            <form action="/html/llms" class="filters">
                                                <div class="filter-group">
                                                    <label for="llm-type" class="neumorphic-label">View LLMs:</label>
                                                    <select name="llm-type" class="neumorphic-input" id="llm-type">
                                                        <option value="all">All</option>
                                                        <option value="local">Local</option>
                                                        <option value="cloud">Cloud</option>
                                                    </select>
                                                </div>
                                                <div class="filter-group">
                                                    <label for="sort" class="neumorphic-label">Sort By:</label>
                                                    <select name="sort" class="neumorphic-input" id="sort">
                                                        <option value="Name">Name</option>
                                                        <option value="top">Top</option>
                                                    </select>
                                                </div>

                                                <button type="submit" class="neumorphic-btn">
                                                    <span class="material-symbols-outlined">arrow_circle_right</span>
                                                </button>
                                            </form>
                                        </div>
                                        <div class="neumorphic-tab-container__tab" id="methods">
                                            <form action="/html/methods" class="filters">
                                                <div class="filter-group">
                                                    <label for="sort" class="neumorphic-label">Sort By:</label>
                                                    <select name="sort" class="neumorphic-input" id="sort">
                                                        <option value="Name">Name</option>
                                                        <option value="top">Top</option>
                                                    </select>
                                                </div>

                                                <button type="submit" class="neumorphic-btn">
                                                    <span class="material-symbols-outlined">arrow_circle_right</span>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="left-content"
                            hx-get="/html/experiments"
                            hx-trigger="load, refresh-experiments from:body"
                            hx-swap="innerHTML">
                                <!--Left content.-->
                            </div>
                        </div>


                    <div class="navigation_view leaf neumorphic-inner" id="right-panel">
                        <div class="neumorphic-outer empty-view">
                    	    <span class="material-symbols-outlined">report</span>
                    	    Nothing selected.
                    	</div>
                    </div>
                </div>
            </div>

            <div class="neumorphic-tab-container__tab" id="leadboard">
                <div class="neumorphic-card content">Hello</div>
            </div>
        </div>

        <!--Modal-->
        <div class="modal fade" id="modalView" tabindex="-1" role="dialog" aria-labelledby="modalViewLabel" aria-hidden="true">
            <div class="modal-dialog neumorphic-card" role="document">
                <div class="modal-header">
                    <h4 id="modalViewTitle">Solution</h4>

                    <button
                        type="button"
                        class="neumorphic-btn"
                        onclick="closeModalView()"
                        aria-label="Close"
                    >
                        <span class="material-symbols-outlined" aria-hidden="true">
                            clear
                        </span>
                    </button>
                </div>
                <div id="modalViewContent" class="modal-body"></div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>-->
        <script src="/frontend/script.js"></script>
        <script>
            window.addEventListener("load", () => {
                const bgColor = getComputedStyle(document.documentElement)
                    .getPropertyValue("--back-color").trim();

                document.body.style.backgroundColor = bgColor;
            });
        </script>
    </body>
</html>
