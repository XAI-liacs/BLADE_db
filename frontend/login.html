<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/frontend/styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <!--<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>-->
        <title>BLADE DB</title>
    </head>
    <body>
    <div class="container">
        <div class="row align-items-center justify-content-center min-vh-100">
            <div class="mx-auto neumorphic-tab-container neumorphic-card align-items-center">
                <img src="/frontend/src/blade_db.png" style="width: 200px;">
                <div class="neumorphic-tab-container__controls neumorphic-outer">
                    <div class="neumorphic-tab-container__control neumorphic-tab-container__control_active" data-target="signup">Sign Up</div>
                    <div class="neumorphic-tab-container__control" data-target="login">Log In</div>
                </div>
            <div class="neumorphic-tab-container__tab neumorphic-tab-container__tab_shown" id="signup">
                <form class="container mx-auto" action="/signup" method="post">
                    <label class="neumorphic-label" for="username">Username:</label>
                    <input class="neumorphic-input" type="text" id="username" name="username" required>

                    <label class="neumorphic-label" for="password">Password:</label>
                    <input class="neumorphic-input" type="password" id="password" name="password" required>

                    <button class="neumorphic-btn px-4 py-2 mt-5 mb-3" type="submit">Sign Up</button>
                </form>
            </div>
            <div class="neumorphic-tab-container__tab" id="login">
                <form class="container mx-auto" action="/login" method="post">
                    <label class="neumorphic-label" for="username">Username:</label>
                    <input class="neumorphic-input" type="text" id="username" name="username" required>

                    <label class="neumorphic-label" for="password">Password:</label>
                    <input class="neumorphic-input" type="password" id="password" name="password" required>

                    <button class="neumorphic-btn px-4 py-2 mt-5 mb-3" type="submit">Log In</button>
                </form>
            </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/frontend/script.js"></script>
    <script>
        window.addEventListener("load", () => {
            const bgColor = getComputedStyle(document.documentElement)
                .getPropertyValue("--back-color").trim();

            document.body.style.backgroundColor = bgColor;
        });
    </script>
    </body>
</html>
