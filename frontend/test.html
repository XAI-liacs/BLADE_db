<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/frontend/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>


</head>
<body>

    <header>
        <h1>Welcome</h1>
    </header>

    <main style="display: flex; flex:0; flex-direction: column;">
        <button class="neumorphic-btn" id="openPopup"
            hx-on:click="document.getElementById('category-popup').classList.toggle('show')"
            style="flex:0;">
            <span class="material-symbols-outlined">category</span>
        </button>
        <!-- Popup -->
        <div class="popup">
            <div class="popuptext" id="category-popup">
            <!--<button class="neumorphic-btn">Hello</button>-->
                    <div class="neumorphic-tab-container__controls" id="category">
                        <div class="neumorphic-tab-container__control neumorphic-tab-container__control_active" data-target="experiments">Experiments</div>
                        <div class="neumorphic-tab-container__control" data-target="llms">LLMs</div>
                        <div class="neumorphic-tab-container__control" data-target="methods">Methods</div>
                    </div>

                <div class="neumorphic-tab-container" id="category">
                    <div class="neumorphic-tab-container__tab neumorphic-tab-container__tab_shown" id="experiments">
                        <!--Experiments-->
                        <form action="/html/experiments" class="filters">
                            <div class="filter-group">
                                <label for="visibility">Created By:</label>
                                <select name="visibility" id="visibility">
                                    <option value="all">All</option>
                                    <option value="personal">Personal</option>
                                    <option value="public">Public</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label for="sort">Sort By:</label>
                                <select name="sort" id="sort">
                                    <option value="date">Date</option>
                                    <option value="Name">Name</option>
                                </select>
                            </div>

                            <button type="submit" class="neumorphic-btn">
                                <span class="material-symbols-outlined">arrow_circle_right</span>
                            </button>
                        </form>
                    </div>
                    <div class="neumorphic-tab-container__tab" id="llms">
                        <!--LLMs-->
                        <form action="/html/llms" class="filters">
                            <div class="filter-group">
                                <label for="llm-type">View LLMs:</label>
                                <select name="llm-type" id="llm-type">
                                    <option value="all">All</option>
                                    <option value="local">Local</option>
                                    <option value="cloud">Cloud</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label for="sort">Sort By:</label>
                                <select name="sort" id="sort">
                                    <option value="Name">Name</option>
                                    <option value="top">Top</option>
                                </select>
                            </div>

                            <button type="submit" class="neumorphic-btn">
                                <span class="material-symbols-outlined">arrow_circle_right</span>
                            </button>
                        </form>
                    </div>
                    <div class="neumorphic-tab-container__tab" id="methods">
                        <form action="/html/methods" class="filters">
                            <div class="filter-group">
                                <label for="sort">Sort By:</label>
                                <select name="sort" id="sort">
                                    <option value="Name">Name</option>
                                    <option value="top">Top</option>
                                </select>
                            </div>

                            <button type="submit" class="neumorphic-btn">
                                <span class="material-symbols-outlined">arrow_circle_right</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer style="background-color: blue;">
        <p>&copy; 2026 My Website</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/frontend/script.js"></script>
    <!-- JavaScript -->
</body>
</html>
